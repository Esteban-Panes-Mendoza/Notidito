services:
  postgres:
    image: postgres:15-alpine
    container_name: notidito_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: notidito_user
      POSTGRES_PASSWORD: notidito_pass
      POSTGRES_DB: notidito_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: notidito_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata: